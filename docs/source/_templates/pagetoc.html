{% set toc_nodes = derender_toc(toc, True, pagename) %}
{% if toc_nodes %}
  <nav class="md-nav md-nav--secondary">
    <label class="md-nav__title" for="__toc">{{ theme_localtoc_label_text or 'On this page' }}</label>
    <ul class="md-nav__list" data-md-scrollfix="">
      {%- for item in toc_nodes recursive %}
        <li class="md-nav__item">
          <a href="{{ item.href|e }}" class="md-nav__link{% if item.current %} md-nav__link--active{% endif %}">{{ item.contents }}</a>
          {%- if item.children -%}
            <nav class="md-nav">
              <ul class="md-nav__list">{{ loop(item.children) }}</ul>
            </nav>
          {%- endif %}
        </li>
      {%- endfor %}
    </ul>
  </nav>
{% endif %}
